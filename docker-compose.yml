# docker compose up --build  →  UI: http://localhost:3000
name: scc

x-backend: &backend
  build: ./backend
  image: scc-backend
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    DATABASE_URL: postgres://scc:scc@postgres:5432/scc?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    PROVIDER_BASE_URL: http://mockprovider:8090
    LOG_LEVEL: info

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: scc
      POSTGRES_PASSWORD: scc
      POSTGRES_DB: scc
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scc -d scc"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    # AOF so queued deliveries survive a Redis restart; Postgres is still
    # the source of truth and the reconciler re-enqueues anything lost.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: migrate and seed fake users (skipped if users exist).
  seed:
    <<: *backend
    restart: "no"
    command: ["seed", "-users", "4000", "-days", "180"]
    depends_on:
      postgres: { condition: service_healthy }

  mockprovider:
    <<: *backend
    command: ["mockprovider"]
    environment:
      HTTP_ADDR: ":8090"
    ports: ["8090:8090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 2s
      retries: 30

  api:
    <<: *backend
    command: ["api"]
    ports: ["8080:8080"]
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mockprovider: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 3s
      retries: 30

  worker:
    <<: *backend
    command: ["worker"]
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mockprovider: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/healthz"]
      interval: 3s
      retries: 30

  web:
    build: ./frontend
    restart: unless-stopped
    ports: ["3000:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
