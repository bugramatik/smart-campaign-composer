# Throwaway Postgres + Redis for `make test` (no volumes, separate project).
name: scc-test

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: scc
      POSTGRES_PASSWORD: scc
      POSTGRES_DB: scc_test
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scc -d scc_test"]
      interval: 1s
      retries: 60

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      retries: 60

  test:
    image: golang:1.27
    working_dir: /src
    volumes:
      - ./backend:/src
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    environment:
      TEST_DATABASE_URL: postgres://scc:scc@postgres:5432/scc_test?sslmode=disable
      TEST_REDIS_URL: redis://redis:6379/15
      # Docker Desktop VMs are often small; compiling the Anthropic SDK with
      # -race on every core at once can exhaust memory.
      GOFLAGS: -p=1
    command: ["sh", "-c", "go vet ./... && go test -race -count=1 ./..."]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  gomod:
  gobuild:
